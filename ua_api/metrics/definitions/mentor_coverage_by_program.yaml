name: mentor_coverage_by_program
description: >-
  Count of active, non-deleted mentors broken down by program (Liftoff,
  Liftoff-Spark, Liftoff-Propel, Ignite). Always uses COUNT(DISTINCT user_id)
  because the mentor table is exploded ~33× per mentor. Use for "how many
  mentors are in each program?", "mentor count by program", "which program
  has the most mentors?", or "mentor coverage across programs".
aliases:
  - "mentors by program"
  - "mentor count by program"
  - "mentor coverage by program"
  - "how many mentors per program"
  - "active mentors in each program"
  - "which program has the most mentors"
  - "mentor supply by program"
  - "mentors across programs"
  - "compare mentor count across liftoff programs"
  - "total active mentors per program"
owner: analytics-team
certified: true
source: questions_to_sql.md#Q21,Q22
returns:
  response_type: bar_chart
  label: program
  value: active_mentors

sql_template: |
  SELECT
    program,
    COUNT(DISTINCT user_id) AS active_mentors
  FROM nep_mentor_profiles_sample_data
  WHERE user_status = 'ACTIVE'
    AND deleted = false
    AND program IS NOT NULL
  GROUP BY program
  ORDER BY active_mentors DESC
  LIMIT 500
