name: nep_master_live_events_data
description: >-
  Live events and each participant's attendance record. One row per participant
  per event. Use GROUP BY event_id for event-level metrics.
grain: One row per (event_id, participant) registration.
owner: analytics-team
source_csv: csvfiles/nep_master_live_events_data.csv
# No single-column primary key: rows are unique at (event_id, participant_id).
primary_key: null

joins:
  - column: participant_user_id
    references_table: nep_master_user_table_sample_data
    references_column: user_id
    description: The participating user in the master user registry.

columns:
  - name: event_id
    logical_type: id
    db_type: TEXT
    description: Unique ID for the event.
    nullable: false
    is_key: true
    sample_values: ["68edcb24587478ed3b44e3b6"]
  - name: event_title
    logical_type: text
    db_type: TEXT
    description: Full title of the event.
  - name: event_status
    logical_type: enum
    db_type: TEXT
    description: Event lifecycle status.
    enum_values: ["COMPLETED", "OPEN"]
  - name: country
    logical_type: text
    db_type: TEXT
    description: Country for the event.
  - name: provider
    logical_type: text
    db_type: TEXT
    description: Organisation that hosted the event.
    sample_values: ["Wadhwani"]
  - name: organizer_id
    logical_type: id
    db_type: TEXT
    description: UUID of the organiser.
  - name: client_name
    logical_type: enum
    db_type: TEXT
    description: Client program short code.
    enum_values: ["WE", "NEP"]
  - name: description
    logical_type: text
    db_type: TEXT
    description: Full event description.
  - name: invite_type
    logical_type: enum
    db_type: TEXT
    description: Invitation visibility type.
    enum_values: ["gap", "open"]
  - name: zoom_meeting_id
    logical_type: text
    db_type: TEXT
    description: Zoom meeting ID.
  - name: participants_limit
    logical_type: text
    db_type: TEXT
    description: Maximum participants (stored as text).
  - name: start_datetime
    logical_type: timestamp
    db_type: TEXT
    description: UTC start timestamp (ISO 8601).
    date_format: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
  - name: start_date
    logical_type: date_string
    db_type: DATE
    description: Date of event start. Supports TO_CHAR(start_date, 'YYYY-MM').
    date_format: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
    sample_values: ["2025-12-19"]
  - name: end_datetime
    logical_type: timestamp
    db_type: TEXT
    description: UTC end timestamp (ISO 8601).
    date_format: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
  - name: language
    logical_type: text
    db_type: TEXT
    description: Language of the event.
    sample_values: ["en"]
  - name: program_key
    logical_type: enum
    db_type: TEXT
    description: NEP program this event belongs to.
    enum_values: ["liftoff-propel", "liftoff", "liftoff-spark"]
  - name: gapkey
    logical_type: enum
    db_type: TEXT
    description: >
      Strategic gap area (skill/topic domain). INCOMPATIBLE with mentor.industry_name
      (industry sectors) — these are disjoint taxonomies; never join or compare them.
      Use gapkey to filter events by topic; use industry_name to filter mentors by sector.
    enum_values:
      ["AdvancedCustomerAcquisition", "BusinessModelCanvas",
       "CompetitiveStrategy", "CustomerRetention", "FounderDNA",
       "GotoMarketStrategy", "GrowthHacking",
       "MarketAnalysisCustomerInsights", "MetricsandAnalytics",
       "PitchMastery", "PivotPersevere", "ProductIteration",
       "ScalableBusinessModel", "StartupFinancials"]
  - name: topickey
    logical_type: text
    db_type: TEXT
    description: Specific topic key.
    sample_values: ["GrowthHacking101"]
  - name: sessiontype
    logical_type: enum
    db_type: TEXT
    description: Session format.
    enum_values: ["expertSession", "roundTable"]
  - name: created_at
    logical_type: date_string
    db_type: DATE
    description: Date when the event record was created.
    date_format: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
  - name: updated_at
    logical_type: date_string
    db_type: DATE
    description: Date of most recent event update.
    date_format: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
  - name: speaker_name
    logical_type: text
    db_type: TEXT
    description: Full name of the speaker.
  - name: speaker_email
    logical_type: text
    db_type: TEXT
    description: Speaker's email.
  - name: speaker_bio
    logical_type: text
    db_type: TEXT
    description: Speaker biography.
  - name: event_type
    logical_type: enum
    db_type: TEXT
    description: Technical delivery type.
    enum_values: ["meeting", "webinar"]
  - name: participant_id
    logical_type: id
    db_type: TEXT
    description: Unique ID for this registration (MongoDB ObjectId).
    is_key: true
  - name: participant_status
    logical_type: enum
    db_type: TEXT
    description: >
      Attendance outcome — mutually exclusive per (participant, event): each row is
      exactly one of ATTENDED, NOSHOW, or REGISTERED. REGISTERED = registered but
      outcome not yet recorded; ATTENDED = showed up; NOSHOW = did not show.
      Canonical no-show rate: NOSHOW / NULLIF(ATTENDED + NOSHOW + REGISTERED, 0).
      Canonical attendance rate: ATTENDED / NULLIF(ATTENDED + NOSHOW + REGISTERED, 0).
      NEVER use only REGISTERED as the denominator — that excludes attended/noshow rows.
    enum_values: ["ATTENDED", "NOSHOW", "REGISTERED"]
    partition: true
  - name: participant_created_at
    logical_type: timestamp
    db_type: TEXT
    description: Timestamp when participant registered (ISO 8601).
    date_format: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
  - name: participant_updated_at
    logical_type: timestamp
    db_type: TEXT
    description: Timestamp of last participant update (ISO 8601).
    date_format: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
  - name: metadata_id
    logical_type: id
    db_type: TEXT
    description: Internal metadata record ID.
  - name: metadata_topic
    logical_type: text
    db_type: TEXT
    description: Topic from Zoom metadata.
  - name: metadata_join_url
    logical_type: text
    db_type: TEXT
    description: Zoom join URL.
  - name: metadata_start_time
    logical_type: timestamp
    db_type: TEXT
    description: Start time from Zoom metadata (ISO 8601).
    date_format: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
  - name: metadata_registrant_id
    logical_type: id
    db_type: TEXT
    description: Zoom registrant ID.
  - name: participant_email
    logical_type: text
    db_type: TEXT
    description: Participant's email.
  - name: participant_user_id
    logical_type: id
    db_type: TEXT
    description: UUID of participant. Joins to user_id in the user table.
    is_key: true
  - name: participant_client_name
    logical_type: text
    db_type: TEXT
    description: Client program of participant.
  - name: participant_first_name
    logical_type: text
    db_type: TEXT
    description: Participant's first name.
  - name: participant_last_name
    logical_type: text
    db_type: TEXT
    description: Participant's last name.
  - name: particpant_country
    logical_type: text
    db_type: TEXT
    description: Participant's country. NOTE intentional typo in column name (missing 'i').
  - name: rating_user_response_value
    logical_type: integer
    db_type: INTEGER
    description: Session rating (1-5).
  - name: rating_user_response_text
    logical_type: text
    db_type: TEXT
    description: Text feedback from rating.
  - name: feedback_user_id
    logical_type: id
    db_type: TEXT
    description: User ID linked to rating.
  - name: organiser_name
    logical_type: text
    db_type: TEXT
    description: Organiser display name.
