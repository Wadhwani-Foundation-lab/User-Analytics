name: nep_mentor_profiles_sample_data
description: >-
  Mentor profiles. One row per mentor. Contains professional background,
  expertise, location and account status.
grain: >-
  One row per mentor × profile-attribute combination (the row is exploded across
  program / industry / stage / education / employment). Neither user_id nor _id
  is unique — ~1,515 distinct mentors across ~49,486 rows (~33 rows per mentor).
  ALWAYS count mentors with COUNT(DISTINCT user_id), never COUNT(*).
owner: analytics-team
source_csv: csvfiles/nep_mentor_profiles_sample_data.csv
# No single-column primary key: both user_id and _id repeat. See grain.
primary_key: null

joins:
  - column: user_id
    references_table: nep_master_user_table_sample_data
    references_column: user_id
    description: Mentor's user account in the master user registry.

columns:
  - name: _id
    logical_type: id
    db_type: TEXT
    description: MongoDB ObjectId — primary profile identifier.
    sample_values: ["621385eaf83f050013d6bc04"]
  - name: user_id
    logical_type: id
    db_type: TEXT
    description: UUID of mentor's user account. Joins to user_id in the user table.
    nullable: false
    is_key: true
  - name: first_name
    logical_type: text
    db_type: TEXT
    description: Mentor's first name.
  - name: last_name
    logical_type: text
    db_type: TEXT
    description: Mentor's last name.
  - name: email
    logical_type: text
    db_type: TEXT
    description: Mentor's email.
  - name: title
    logical_type: text
    db_type: TEXT
    description: Professional title / designation.
  - name: bio
    logical_type: text
    db_type: TEXT
    description: Full professional biography.
  - name: user_status
    logical_type: enum
    db_type: TEXT
    description: Account status.
    enum_values: ["ACTIVE", "PENDING"]
  - name: visibility
    logical_type: enum
    db_type: TEXT
    description: Profile visibility.
    enum_values: ["PUBLIC", "INTERNAL"]
  - name: preferred_language
    logical_type: text
    db_type: TEXT
    description: ISO 639-1 language code.
    sample_values: ["en", "es", "pt"]
  - name: created_at
    logical_type: timestamp
    db_type: TIMESTAMP
    description: Timestamp when profile was created.
    date_format: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
  - name: updated_at
    logical_type: timestamp
    db_type: TIMESTAMP
    description: Timestamp of last profile update.
    date_format: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
  - name: deleted
    logical_type: boolean
    db_type: BOOLEAN
    description: Soft-delete flag. false = active.
  - name: company_type
    logical_type: enum
    db_type: TEXT
    description: Company affiliation type. Vocabulary confirmed against live data.
    enum_values: ["CONNECT", "LIST"]
  - name: linkedin_url
    logical_type: text
    db_type: TEXT
    description: LinkedIn profile URL.
  - name: profile_image_url
    logical_type: text
    db_type: TEXT
    description: Profile photo URL.
  - name: country
    logical_type: text
    db_type: TEXT
    description: Country where the mentor is based.
    sample_values: ["India", "Nigeria", "Mexico"]
  - name: state
    logical_type: text
    db_type: TEXT
    description: State / province of the mentor.
  - name: city
    logical_type: text
    db_type: TEXT
    description: City of the mentor.
  - name: role
    logical_type: enum
    db_type: TEXT
    description: System role. Always MENTOR in this table.
    enum_values: ["MENTOR"]
  - name: mentor_type
    logical_type: enum
    db_type: TEXT
    description: Type of mentor engagement.
    enum_values: ["MENTOR", "EXPERT", "SERVICE_PROVIDER"]
  - name: program
    logical_type: enum
    db_type: TEXT
    description: NEP program(s) the mentor is associated with. Column is `program`, NOT `program_key`.
    enum_values:
      ["ignite", "liftoff-spark", "liftoff-propel", "liftoff", "activate",
       "fop", "bootcamp", "SMB", "Ignite-self-serve", "foundational",
       "advanced", "test"]
  - name: language_known
    logical_type: text
    db_type: TEXT
    description: Languages the mentor knows.
  - name: stage_id
    logical_type: text
    db_type: TEXT
    description: Stage ID (stored as text).
    sample_values: ["1", "2", "3", "4", "5"]
  - name: stage_name
    logical_type: enum
    db_type: TEXT
    description: Startup stage the mentor advises on.
    enum_values:
      ["Pre Idea Stage", "Idea Stage", "Early Stage", "Growth Stage",
       "Traction Stage", "Scale Stage", "Demo Stage"]
  - name: industry_id
    logical_type: text
    db_type: TEXT
    description: Industry ID (stored as text).
  - name: industry_name
    logical_type: text
    db_type: TEXT
    description: Industry sector.
    sample_values: ["Services", "FinTech", "Gaming", "Real Estate & Housing", "Mobility"]
  - name: degree
    logical_type: text
    db_type: TEXT
    description: Highest educational degree.
  - name: institute_name
    logical_type: text
    db_type: TEXT
    description: Educational institution.
  - name: edu_start_date
    logical_type: text
    db_type: TEXT
    description: Education start date (free text, e.g. "September 2010").
  - name: graduation_date
    logical_type: text
    db_type: TEXT
    description: Graduation date (free text).
  - name: employer_name
    logical_type: text
    db_type: TEXT
    description: Current / recent employer.
  - name: employment_sector
    logical_type: text
    db_type: TEXT
    description: Job title / role at employer.
  - name: emp_start_date
    logical_type: text
    db_type: TEXT
    description: Employment start date (free text).
  - name: emp_end_date
    logical_type: text
    db_type: TEXT
    description: Employment end date (free text).
