name: mentors_by_industry_and_program
description: >-
  Mentor count broken down by BOTH program AND industry — shows all programs
  side-by-side so you can compare industry coverage across Liftoff,
  Liftoff-Spark, and Liftoff-Propel in one table. Defaults to mentors of any
  status; optionally filtered to ACTIVE-only. Always uses COUNT(DISTINCT
  user_id). Use for "compare industry coverage across programs", "mentor
  industry breakdown by program", "which industries are covered in
  Liftoff-Spark vs Liftoff-Propel".
aliases:
  - "mentor industry coverage by program"
  - "compare industry coverage across programs"
  - "mentors by industry and program"
  - "mentor industry breakdown by program"
  - "which industries are covered in each program"
  - "industry coverage in liftoff-spark vs liftoff-propel"
  - "compare mentor industry coverage across programs"
  - "mentor supply by program and industry"
owner: analytics-team
certified: true
source: questions_to_sql.md#Q21,Q22
returns:
  response_type: table
  label: program
  value: active_mentors

choices:
  user_status:
    default: all
    map:
      all:
        user_status_filter: ""
      active:
        user_status_filter: " AND user_status = 'ACTIVE'"

sql_template: |
  SELECT
    program,
    industry_name,
    COUNT(DISTINCT user_id) AS active_mentors
  FROM nep_mentor_profiles_sample_data
  WHERE deleted = false
    AND program IN ('liftoff', 'liftoff-spark', 'liftoff-propel')
    AND industry_name IS NOT NULL{user_status_filter}
  GROUP BY program, industry_name
  ORDER BY program, active_mentors DESC
  LIMIT 500
