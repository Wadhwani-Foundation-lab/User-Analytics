name: user_engagement_tiers
description: >-
  Distribution of users across engagement tiers: one-time (1 question), casual
  (2-5), engaged (6-10), and power users (10+). Shows the overall engagement
  depth across the user base.
aliases:
  - "user tiers"
  - "engagement tiers"
  - "user segments by questions"
  - "casual vs power users"
  - "one-time casual engaged power"
  - "question depth distribution"
  - "how engaged are users"
owner: analytics-team
certified: true
source: questions_to_sql.md#Q16
returns:
  response_type: bar_chart
  label: user_segment
  value: users

sql_template: |
  SELECT
    CASE
      WHEN questions_asked = 1              THEN '1 question (one-time)'
      WHEN questions_asked BETWEEN 2 AND 5  THEN '2-5 questions (casual)'
      WHEN questions_asked BETWEEN 6 AND 10 THEN '6-10 questions (engaged)'
      ELSE '10+ questions (power user)'
    END AS user_segment,
    COUNT(*) AS users
  FROM (
    SELECT userid, COUNT(*) AS questions_asked
    FROM nep_liftoffx_data_sample
    WHERE activity_type = 'message' AND message_query IS NOT NULL
    GROUP BY userid
  ) user_counts
  GROUP BY user_segment
  ORDER BY MIN(questions_asked)
  LIMIT 500
